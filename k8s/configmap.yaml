apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-chat-config
  namespace: blueprint-chat
data:
  PORT: "8080"
  ENV: "production"
  LOG_LEVEL: "info"
  BASE_URL: "https://chat-api.blueprintautomation.tech"
  REDIS_SESSION_TTL_MINUTES: "60"
  REDIS_CONFIG_CACHE_TTL_MINUTES: "10"
  ANTHROPIC_MODEL: "claude-sonnet-4-20250514"
  ANTHROPIC_MAX_TOKENS: "4096"
  DEFAULT_SCHEDULER: "calcom"
  CALCOM_API_BASE: "https://api.cal.com/v1"
  CALENDLY_API_BASE: "https://api.calendly.com"
  NOTIFICATION_FROM_EMAIL: "hello@blueprintautomation.tech"
  NOTIFICATION_FROM_NAME: "Blueprint Automations"
  SMTP_HOST: "smtp-relay.brevo.com"
  SMTP_PORT: "587"
  RATE_LIMIT_MESSAGES_PER_MIN: "20"
  RATE_LIMIT_MESSAGES_PER_DAY: "200"
  PORTALS_URL: "https://portal.blueprintautomation.tech"
  BLUEPRINT_COMMAND_API_URL: "http://portals-api.portals.svc.cluster.local:8094"
